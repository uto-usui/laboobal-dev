[[headers]]
  for = "/*"
  [headers.values]
    # lab の記事（webmanab.com）から iframe で埋め込む。手元の webmanab の開発サーバーからも試せるよう localhost を足す
    Content-Security-Policy = "frame-ancestors 'self' https://webmanab.com http://localhost:*"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# トップと webmanab の記事ページが読む動画とポスター。名前にハッシュがなく、撮り直すと同じ名前で中身が変わるので
# immutable にはせず 1 日にとどめる
[[headers]]
  for = "/previews/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
